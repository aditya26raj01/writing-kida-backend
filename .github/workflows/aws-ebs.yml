name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master  # Trigger workflow only on pushes to the "master" branch

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      APPLICATION_NAME: ${{ secrets.APPLICATION_NAME }}
      ENVIRONMENT_NAME: ${{ secrets.ENVIRONMENT_NAME }}

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js environment (optional if your app is Node.js-based)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Step 3: Install dependencies if needed (optional, modify as needed)
      - name: Install Dependencies
        run: |
          npm install

      # Step 4: Zip application files for deployment
      - name: Create ZIP file for deployment
        run: |
          zip -r ${{ github.sha }}.zip . -x ".git/*" "node_modules/*" "*.github/*"

      # Step 5: Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 6: Deploy to AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          # Upload to Elastic Beanstalk's S3 bucket
          aws s3 cp ${{ github.sha }}.zip s3://elasticbeanstalk-${{ secrets.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}/${{ github.sha }}.zip
          
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.APPLICATION_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket=elasticbeanstalk-${{ secrets.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }},S3Key=${{ github.sha }}.zip
          
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"

      # Optional: Notify the team about deployment success
      - name: Notify Deployment Success
        if: success()
        run: echo "✅ Deployment to AWS Elastic Beanstalk succeeded."
